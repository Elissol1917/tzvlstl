<!doctype html>
<html><head><meta charset="utf-8"><title>TizenVLESS</title>
<style>body{background:#12203a;color:#fff;font:34px sans-serif;padding:60px}small{color:#9ab}</style></head>
<body>
<h1>TizenVLESS</h1>
<p id="s">Запуск службы...</p>
<p><small>Настройка VPN: на телефоне откройте http://IP_ТВ:8090</small></p>
<script>
var n = 0;
function st(t) { document.getElementById('s').innerHTML = t; }
function go() {
  var x = new XMLHttpRequest();
  x.open('GET', 'http://127.0.0.1:8090/status.json');
  x.timeout = 2500;
  x.onload = function () {
    var s = {};
    try { s = JSON.parse(x.responseText); } catch (e) {}
    if (s.vpn !== 'configured') { st('VPN не настроен. Откройте на телефоне http://IP_ТВ:8090 и вставьте ссылку vless://'); setTimeout(go, 3000); return; }
    if (s.web !== 'ok' || s.relay !== 'ok') { st('Служба: web=' + s.web + ', relay=' + s.relay); setTimeout(go, 2000); return; }
    st('Открываю YouTube...');
    location.href = 'http://127.0.0.1:8095/tv';
  };
  x.onerror = x.ontimeout = function () { n++; st('Жду службу... ' + n); setTimeout(go, 1000); };
  x.send();
}
go();
</script>
</body></html>
